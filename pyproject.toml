[build-system]
# 77 is the floor for PEP 639: the `license = "MIT"` expression and
# `license-files` below are errors on anything older.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is named for the command it installs, which is also the name
# a user types into `claude mcp add`. One name for one thing: the wheel, the
# console script and the client entry all read the same.
name = "notebook-editor-mcp"
version = "0.1.0"
description = "Local Jupyter notebook editor an MCP client drives, with a browser tab watching the same session"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AgLyx3" }]
keywords = ["mcp", "jupyter", "notebook", "model-context-protocol", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: Jupyter",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "fastapi>=0.115,<1",
  "nbformat>=5.10,<6",
  "jupyter-client>=8.6,<9",
  "ipykernel>=6.29,<8",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/AgLyx3/we-love-jupyter-notebook"
Repository = "https://github.com/AgLyx3/we-love-jupyter-notebook"
Issues = "https://github.com/AgLyx3/we-love-jupyter-notebook/issues"

[project.optional-dependencies]
# The MCP server is optional: the editor runs perfectly well without it, and
# nothing in the app imports these.
mcp = [
  "mcp>=2,<3",
  "httpx>=0.27,<1",
]
test = [
  "httpx>=0.27,<1",
  # The MCP tool surface is covered by backend/tests, so the test extra needs
  # what it imports — CI installs `.[test]` and nothing else.
  "mcp>=2,<3",
  "pytest>=8,<9",
  # Test-only: the plot-tuning fixture notebook has to produce a real
  # image/png output. The app itself never imports matplotlib — the user's
  # kernel has whatever it has.
  "matplotlib>=3.8,<4",
  # Test-only, same reason: the render tests replay real pandas, seaborn and
  # plotly cells, and each of those cases is gated on `pytest.importorskip`.
  # Without them the four library-idiom cases in test_plot_tuning_render.py
  # skip and the suite still looks green. pandas is held at 2.x because
  # seaborn 0.13 is the current release and predates pandas 3.
  "pandas>=2.2,<3",
  "seaborn>=0.13,<1",
  "plotly>=5.18,<7",
]

[project.scripts]
# So `claude mcp add notebook-editor -- notebook-editor-mcp` has a command to name.
notebook-editor-mcp = "backend.app.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend.app*"]
namespaces = true

# The built frontend, which `npm run build` writes into the package (see
# vite.config.ts). Without this the wheel carries Python only and the bundled
# server has no UI to serve.
[tool.setuptools.package-data]
"backend.app" = ["web/**/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
