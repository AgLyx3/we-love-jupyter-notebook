[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyter-notebook-ai-adapter"
version = "0.1.0"
description = "Local notebook editor with scoped AI agent integration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "nbformat>=5.10,<6",
  "jupyter-client>=8.6,<9",
  "ipykernel>=6.29,<8",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend.app*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
