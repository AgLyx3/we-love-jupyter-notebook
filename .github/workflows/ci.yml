name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Under `constraints/ci.txt`, so an upstream release cannot turn `main`
      # red on a pull request whose diff could not have caused it (#59). The
      # file is never verified-fresh here: a `--check` step would resolve
      # against PyPI on every run and go red the moment anything upstream
      # shipped, which is the failure it exists to prevent. It is bumped by
      # hand, with `python3.12 scripts/update_constraints.py`.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci.txt -e '.[test]'
          npm ci
      # #59's other ask: the answer to "what changed?" was a timestamp on PyPI,
      # and nothing in the build output pointed at it. Now it does.
      - name: Record what was installed
        run: pip freeze
      # backend/tests/test_bundle_external_origins.py reads the built bundle and
      # skips without one, which would leave the tab's "no external origin"
      # guarantee unchecked here while reporting green.
      - name: Build the frontend into the package
        run: npm run build
      - name: Test
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npx vitest run

  # The wheel is the thing users actually install, and two of its failure modes
  # are invisible to the jobs above: a wheel built before `npm run build` ships
  # without a frontend and still builds clean, and a package that only imports
  # correctly beside its own checkout looks fine to every test run from one.
  # `scripts/smoke_wheel.py` installs the wheel into a throwaway venv and drives
  # it over stdio like a real client.
  #
  # Deliberately not under `constraints/ci.txt`, unlike the backend job. The
  # whole point of this job is the install a stranger gets from the README, and
  # a stranger resolves `mcp>=2,<3` against PyPI as it is today. So this stays
  # the canary for what users actually receive — it is shallow enough (list the
  # tools, drive one call) that an upstream minor is unlikely to break it, and
  # if one does, that is a real user-facing break worth a red build.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build the frontend into the package
        run: |
          npm ci
          npm run build
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Smoke-test the wheel
        run: python scripts/smoke_wheel.py dist/*.whl
